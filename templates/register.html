{% extends "base.html" %}
{% block title %}MediaFlex — Регистрация{% endblock %}

{% block head %}
<style>
.form-container { display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
.auth-form {
    background-color: rgba(0,0,0,0.75); padding: 60px; border-radius: 8px;
    width: 100%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.auth-form h2 { font-size: 32px; margin-bottom: 28px; }
.input-group { margin-bottom: 20px; }
.input-group input {
    width: 100%; padding: 14px; background-color: #333; border: none;
    border-radius: 4px; color: #fff; font-size: 16px;
}
.input-group input:focus { background-color: #444; outline: none; }
.btn-submit {
    width: 100%; padding: 14px; background-color: #e50914; color: #fff;
    border: none; border-radius: 4px; font-size: 16px; font-weight: bold;
    cursor: pointer; margin-top: 20px; transition: 0.2s;
}
.btn-submit:hover { background-color: #b80710; }
.form-footer { margin-top: 30px; font-size: 14px; color: #737373; }
.form-footer a { color: #fff; text-decoration: none; }
.form-footer a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <form class="auth-form" method="POST">
        <h2>Регистрация</h2>
        <div class="input-group"><input type="text" name="username" placeholder="Имя пользователя" required></div>
        <div class="input-group"><input type="email" name="email" placeholder="Электронная почта" required></div>
        <div class="input-group"><input type="password" name="password" placeholder="Придумайте пароль" required minlength="6"></div>
        <button type="submit" class="btn-submit">Зарегистрироваться</button>
        <div class="form-footer">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>.</div>
    </form>
</div>
{% endblock %}
