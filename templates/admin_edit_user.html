{% extends "base.html" %}
{% block title %}MediaFlex — Редактирование пользователя{% endblock %}

{% block head %}
<style>
.edit-form {
    background-color: #1f1f1f; padding: 30px; border-radius: 8px;
    max-width: 600px; margin: 0 auto;
}
.edit-form h2 { color: #e50914; margin-bottom: 20px; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 13px; }
.form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px; background-color: #2a2a2a;
    border: 1px solid #3a3a3a; border-radius: 4px; color: #fff;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: #e50914; outline: none;
}
.btn-save {
    padding: 12px 30px; background-color: #e50914; color: #fff;
    border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
    width: 100%; font-size: 14px;
}
.btn-save:hover { background-color: #b80710; }
.btn-cancel {
    display: inline-block; margin-top: 10px; color: #aaa; text-decoration: none;
    text-align: center; width: 100%; padding: 10px;
}
.btn-cancel:hover { color: #fff; }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="edit-form">
        <h2> Редактировать пользователя</h2>
        <form method="POST">
            <div class="form-group">
                <label>Имя</label>
                <input type="text" name="username" value="{{ user.username }}" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>
            <div class="form-group">
                <label>Роль</label>
                <select name="role">
                    <option value="user" {% if user.role == 'user' %}selected{% endif %}>Пользователь</option>
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Администратор</option>
                </select>
            </div>
            <button type="submit" class="btn-save"> Сохранить</button>
            <a href="{{ url_for('admin_panel', tab='users') }}" class="btn-cancel">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
